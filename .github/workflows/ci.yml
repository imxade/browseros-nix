name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate source metadata
        run: ./scripts/check-source

      - name: Check formatting
        run: nix fmt -- --check flake.nix package.nix source.nix

      - name: Flake checks
        run: nix flake check --print-build-logs

      - name: Build BrowserOS
        run: nix build .#browseros --print-build-logs

      - name: Verify package layout
        run: |
          test -x result/bin/browseros
          test -f result/share/applications/browseros.desktop
          nix eval --raw .#browseros.version
